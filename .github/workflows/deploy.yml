name: deploy

# ручной запуск; нужен секрет DEPLOY_SSH_KEY (приватный ключ с доступом root@157.22.182.58)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 157.22.182.58 >> ~/.ssh/known_hosts
      - name: deploy
        run: ./deploy.sh
